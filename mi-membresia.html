<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>L&amp;B · Mi membresía</title>

<!--
  The member's page. Static, so it costs none of the twelve serverless functions.

  Deliberately one screen and one decision. The contract already says what the wash is,
  which vehicle it is for and that it is paid, so the only thing left to choose is when.
  No cart, no prices, no deposit, no checkout.
-->

<style>
  :root { color-scheme: light dark; --bg: #0b0d10; --card: #15181d; --line: #262b33; --text: #f2f4f7; --dim: #9aa4b2; --go: #2563eb; --ok: #16a34a; --warn: #b45309; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6f8; --card: #fff; --line: #dfe3e8; --text: #12151a; --dim: #5b6675; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, sans-serif; padding: 18px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .plan { color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .big { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .next { color: var(--ok); font-weight: 650; }
  button { border: 0; border-radius: 11px; padding: 15px; font-size: 16px; font-weight: 680; color: #fff; background: var(--go); width: 100%; cursor: pointer; }
  button[disabled] { opacity: .4; cursor: default; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 12px; }
  .slots button { padding: 13px 6px; font-size: 15px; }
  label { display: block; font-size: 14px; color: var(--dim); margin: 14px 0 6px; }
  input[type=date] { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  .msg { padding: 13px; border-radius: 11px; background: var(--card); border: 1px solid var(--line); color: var(--dim); }
  .addons { display: grid; gap: 8px; margin-top: 10px; }
  .addon { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
  .addon span:last-child { margin-left: auto; font-weight: 700; }
  .pay-choice { display: flex; gap: 12px; color: var(--text); }
  .err { border-color: var(--warn); color: var(--warn); }
  .hide { display: none; }
</style>

<div id="root"><div class="msg">Cargando…</div></div>

<script>
  // Short standing link: /m/<token>, rewritten here by vercel.json. See cuadrilla.html.
  const token = new URLSearchParams(location.search).get('t')
    || decodeURIComponent((location.pathname.match(/^\/m\/([^/]+)/) || [])[1] || '');
  const root = document.getElementById('root');

  // Why a member cannot book right now, in words rather than a code.
  const REASONS = {
    canceled: 'Tu membresía está cancelada. Escribinos para reactivarla.',
    past_due: 'Hay un pago pendiente. En cuanto se acredite podés volver a agendar.',
    pending_payment: 'Tu membresía se activa cuando se acredite el primer pago.',
    visit_already_booked: 'Ya tenés un lavado agendado. Cuando se complete podés pedir el siguiente.',
    no_credits: 'Usaste todos los lavados de este ciclo. Se renuevan al inicio del próximo.',
    too_soon: 'Los lavados de membresía se agendan con 48 horas de anticipación.',
    after_cycle_end: 'Esa fecha queda fuera del ciclo que ya pagaste.'
  };

  const el = (tag, className, textContent) => Object.assign(document.createElement(tag), { className: className || '', textContent: textContent || '' });
  const message = (copy, isError) => { root.textContent = ''; root.append(el('div', `msg${isError ? ' err' : ''}`, copy)); };
  const day = iso => new Date(iso).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  const clock = iso => new Date(iso).toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit' });

  let state = null;

  function render() {
    root.textContent = '';

    root.append(el('h1', '', state.vehicle));
    const plan = el('div', 'plan');
    plan.textContent = state.plan.includes('4x') ? 'Membresía · 4 lavados por ciclo' : 'Membresía · 2 lavados por ciclo';
    root.append(plan);

    // What you have left.
    const balance = el('div', 'card');
    balance.append(el('div', 'big', state.remaining === 1 ? '1 lavado' : `${state.remaining} lavados`));
    const until = state.cycleEndsAt ? ` hasta el ${day(state.cycleEndsAt)}` : '';
    balance.append(el('div', 'sub', state.remaining > 0 ? `disponible${state.remaining === 1 ? '' : 's'}${until}` : `sin lavados${until}`));
    if (state.nextVisit) {
      const next = el('div', 'sub');
      next.append(el('span', 'next', `Próximo lavado: ${day(state.nextVisit.startsAt)}, ${clock(state.nextVisit.startsAt)}`));
      balance.append(next);
    }
    root.append(balance);

    if (!state.canBook) {
      root.append(el('div', 'msg', REASONS[state.reason] || 'Por ahora no se puede agendar.'));
      return;
    }

    // The only decision: when.
    const picker = el('div', 'card');
    const selected = new Set(state.selectedAddonIds || []);
    if ((state.addons || []).length) {
      picker.append(el('label', '', 'Extras opcionales (se cobran aparte)'));
      const extras = el('div', 'addons');
      for (const addon of state.addons) {
        const line = el('label', 'addon');
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = selected.has(addon.id);
        check.onchange = () => check.checked ? selected.add(addon.id) : selected.delete(addon.id);
        line.append(check, el('span', '', addon.name), el('span', '', `$${addon.amount}`));
        extras.append(line);
      }
      picker.append(extras);
      const payment = el('div', 'pay-choice');
      payment.innerHTML = '<label><input type="radio" name="addonPayment" value="online" checked> Pagar online</label><label><input type="radio" name="addonPayment" value="cash"> Efectivo a la cuadrilla</label>';
      picker.append(payment);
    }
    picker.append(el('label', '', `Elegí el día (mínimo ${state.noticeHours} horas de anticipación)`));
    const input = document.createElement('input');
    input.type = 'date';
    input.min = state.range.from;
    input.max = state.range.to;
    input.value = state.date || state.range.from;
    picker.append(input);

    const slots = el('div', 'slots');
    picker.append(slots);
    const hint = el('div', 'sub');
    picker.append(hint);
    root.append(picker);

    function paint(times) {
      slots.textContent = '';
      if (!times) return hint.textContent = 'Buscando horarios…';
      if (!times.length) return hint.textContent = 'No quedan horarios ese día. Probá otra fecha.';
      hint.textContent = '';
      for (const startTime of times) {
        const button = el('button', '', startTime);
        button.onclick = () => {
          const method = (picker.querySelector('input[name="addonPayment"]:checked') || {}).value || 'cash';
          book(input.value, startTime, button, [...selected], method);
        };
        slots.append(button);
      }
    }

    input.onchange = async () => {
      paint(null);
      try {
        const fresh = await load(input.value);
        state = { ...fresh, date: input.value };
        paint(fresh.slots || []);
      } catch (error) { hint.textContent = error.message; }
    };

    paint(state.slots || null);
    if (!state.slots) input.onchange();
  }

  async function load(date) {
    const query = new URLSearchParams({ t: token });
    if (date) query.set('date', date);
    const response = await fetch(`/api/member?${query}`);
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.ok) throw new Error(result.error || 'No se pudo cargar');
    return result;
  }

  async function book(date, startTime, button, addonIds, addonPayment) {
    const original = button.textContent;
    button.disabled = true;
    button.textContent = '…';
    try {
      const response = await fetch('/api/member', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: token, date, startTime, addonIds, addonPayment })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.error || 'No se pudo agendar');
      // Re-read rather than patching: the balance is derived from the calendar, so the
      // server's answer is the only one worth showing.
      state = await load();
      render();
      root.prepend(el('div', 'msg', `Listo. Te esperamos el ${day(result.startsAt)} a las ${clock(result.startsAt)}.`));
      if (result.addonPaymentUrl) window.open(result.addonPaymentUrl, '_blank', 'noopener');
    } catch (error) {
      button.disabled = false;
      button.textContent = original;
      alert(error.message);
    }
  }

  (async () => {
    if (!token) return message('Falta el enlace de tu membresía.', true);
    try {
      state = await load();
      render();
    } catch (error) { message(error.message, true); }
  })();
</script>
