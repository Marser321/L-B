<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>L&amp;B · Cuadrilla</title>

<!--
  The crew's screen. Static on purpose: it costs no serverless function, and the
  Hobby plan has twelve.

  Everything it knows comes from GET /api/crew?t=<token>. The token stays in the URL
  and is never written to storage, so a shared phone does not leave a signed link
  behind after the tab is closed.
-->

<style>
  :root { color-scheme: light dark; --bg: #0b0d10; --card: #15181d; --line: #262b33; --text: #f2f4f7; --dim: #9aa4b2; --ok: #16a34a; --cash: #2563eb; --link: #7c3aed; --warn: #b45309; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6f8; --card: #fff; --line: #dfe3e8; --text: #12151a; --dim: #5b6675; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif; padding: 16px; max-width: 620px; margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0; }
  .van { color: var(--dim); font-size: 14px; }
  .stop { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .when { font-weight: 700; font-size: 17px; }
  .title { margin: 2px 0 6px; }
  .meta { color: var(--dim); font-size: 14px; }
  .money { margin-top: 8px; font-size: 15px; }
  .balance { font-weight: 700; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  button { flex: 1; border: 0; border-radius: 10px; padding: 13px 10px; font-size: 15px; font-weight: 650; color: #fff; cursor: pointer; }
  /* Big targets: this is used one-handed, outdoors, with wet hands. */
  .attend { background: var(--ok); }
  .cash { background: var(--cash); }
  .link { background: var(--link); }
  .noshow { background: var(--warn); }
  /* Cancelling is the one action nobody should hit by accident, so it does not get a
     full-width coloured button next to the ones the crew presses all day. */
  .cancel { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; font-size: 14px; padding: 10px; }
  button[disabled] { opacity: .45; cursor: default; }
  .done { color: var(--ok); font-weight: 700; margin-top: 10px; }
  .missed { color: var(--warn); font-weight: 700; margin-top: 10px; }
  .msg { padding: 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--dim); }
  .err { border-color: var(--warn); color: var(--warn); }
</style>

<header>
  <h1>Hoy</h1>
  <span class="van" id="van"></span>
</header>
<div id="list"><div class="msg">Cargando…</div></div>

<script>
  // The short standing link is /c/<token>, rewritten to this page by vercel.json —
  // a rewrite, so the address bar keeps the short path and there is no query string
  // to read. ?t= is still accepted for links already handed out.
  const token = new URLSearchParams(location.search).get('t')
    || decodeURIComponent((location.pathname.match(/^\/c\/([^/]+)/) || [])[1] || '');
  const list = document.getElementById('list');
  const money = value => `$${Number(value).toFixed(0)}`;

  function message(text, isError) {
    list.innerHTML = `<div class="msg${isError ? ' err' : ''}"></div>`;
    list.firstChild.textContent = text;
  }

  // textContent everywhere, never innerHTML: the title and address come from the CRM
  // and a customer could have typed anything into them.
  function el(className, text) {
    const node = document.createElement('div');
    node.className = className;
    node.textContent = text;
    return node;
  }

  function button(className, label, onClick) {
    const node = document.createElement('button');
    node.className = className;
    node.textContent = label;
    node.onclick = () => onClick(node);
    return node;
  }

  // Both money actions ask the same question; only what happens to the answer differs.
  function charge(node, stop, action, question) {
    const suggested = stop.balance != null ? String(stop.balance) : '';
    const entered = prompt(question, suggested);
    if (entered === null) return;
    const amount = Number(entered);
    if (!Number.isFinite(amount) || amount <= 0) return alert('Monto inválido.');
    act(node, { action, appointmentId: stop.appointmentId, amount });
  }

  function render(day) {
    document.getElementById('van').textContent = `${day.van.replace('_', ' ')} · ${day.date}`;
    if (!day.stops.length) return message('No hay servicios agendados para hoy.');

    list.textContent = '';
    for (const stop of day.stops) {
      const card = document.createElement('div');
      card.className = 'stop';

      const when = document.createElement('div');
      when.className = 'when';
      when.textContent = `${stop.from} – ${stop.to}`;
      card.append(when);

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = stop.title;
      card.append(title);

      if (stop.address) {
        const address = document.createElement('div');
        address.className = 'meta';
        address.textContent = stop.address;
        card.append(address);
      }
      if (stop.order) {
        const order = document.createElement('div');
        order.className = 'meta';
        order.textContent = stop.order;
        card.append(order);
      }
      if (stop.total != null) {
        const amounts = document.createElement('div');
        amounts.className = 'money';
        const paid = stop.deposit != null ? ` · depósito ${money(stop.deposit)} pagado` : '';
        amounts.innerHTML = `total ${money(stop.total)}${paid}`;
        if (stop.balance != null) {
          const balance = document.createElement('span');
          balance.className = 'balance';
          balance.textContent = ` · resta ${money(stop.balance)}`;
          amounts.append(balance);
        }
        card.append(amounts);
      }

      // A stop that already has an outcome shows it instead of the buttons: the crew
      // reloads this list all day and must not be able to mark the same job twice.
      if (stop.status === 'showed' || stop.status === 'completed') {
        card.append(el('done', '✓ Atendida'));
      } else if (stop.status === 'noshow') {
        card.append(el('missed', '✗ No estaba el cliente'));
      } else {
        // Row 1 — how the stop ended. These are the two that consume a membership
        // credit, so they sit together and nothing else looks like them.
        const outcome = document.createElement('div');
        outcome.className = 'row';
        outcome.append(
          button('attend', 'Atendida', b => act(b, { action: 'attended', appointmentId: stop.appointmentId })),
          button('noshow', 'No estaba', b => {
            if (!confirm('¿Marcar que el cliente no estaba? Se cobra igual.')) return;
            act(b, { action: 'no_show', appointmentId: stop.appointmentId });
          })
        );
        card.append(outcome);

        // Row 2 — how they paid. Both ask for the amount, pre-filled with what is owed
        // and editable, because a customer may pay part or add a tip and the record has
        // to match what actually changed hands.
        const payment = document.createElement('div');
        payment.className = 'row';
        payment.append(
          button('cash', 'Cobré efectivo', b => charge(b, stop, 'cash', '¿Cuánto se cobró en efectivo?')),
          button('link', 'Link de pago', b => charge(b, stop, 'payment_link', '¿Por cuánto mando el link de pago?'))
        );
        card.append(payment);

        const cancelRow = document.createElement('div');
        cancelRow.className = 'row';
        cancelRow.append(button('cancel', 'Cancelar la cita', b => {
          if (!confirm('¿Cancelar esta cita? No se cobra y el crédito vuelve al cliente.')) return;
          act(b, { action: 'cancel', appointmentId: stop.appointmentId });
        }));
        card.append(cancelRow);
      }
      list.append(card);
    }
  }

  async function act(button, payload) {
    const original = button.textContent;
    button.disabled = true;
    button.textContent = 'Guardando…';
    try {
      const response = await fetch('/api/crew', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t: token, ...payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.error || 'No se pudo guardar');
      // The link was already sent by email and SMS; opening it here is so the crew can
      // hold the phone out and let the customer pay on the spot.
      if (result.paymentUrl) window.open(result.paymentUrl, '_blank', 'noopener');
      else if (result.method === 'link') alert('Link enviado al cliente por SMS y email.');
      // Reload rather than patching the card: the calendar is the source of truth and
      // the office may have changed something while the crew was driving.
      await load();
    } catch (error) {
      button.disabled = false;
      button.textContent = original;
      alert(error.message);
    }
  }

  async function load() {
    if (!token) return message('Falta el enlace de la cuadrilla.', true);
    try {
      const response = await fetch(`/api/crew?t=${encodeURIComponent(token)}`);
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.error || 'No se pudo cargar');
      render(result);
    } catch (error) {
      message(error.message, true);
    }
  }

  load();
</script>
